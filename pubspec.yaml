name: khetopedia
description: A new Flutter project.

environment:
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # ── State management ──────────────────────────────────────────────────────
  flutter_riverpod: ^2.6.1
  # ── Networking ────────────────────────────────────────────────────────────
  dio: ^5.7.0
  # ── Secure storage ────────────────────────────────────────────────────────
  flutter_secure_storage: ^9.2.2
  # ── Plugins & Utilities ───────────────────────────────────────────────────
  auto_size_text: ^3.0.0
  cached_network_image: ^3.4.1
  collection: ^1.19.0
  fl_chart: ^1.0.0
  flutter_animate: ^4.5.0
  flutter_cache_manager: ^3.4.1
  flutter_shaders: ^0.1.3
  flutter_svg: ^2.1.0
  font_awesome_flutter: ^10.7.0
  from_css_color: ^2.0.0
  go_router: ^12.1.3
  google_fonts: ^6.2.1
  image_picker: ^1.1.2
  intl: ^0.20.3
  json_path: ^0.7.2
  material_palette: ^1.6.0
  page_transition: ^2.1.0
  path_provider: ^2.1.4
  percent_indicator: ^4.2.2
  permission_handler: ^11.3.1
  provider: ^6.1.2
  shared_preferences: ^2.3.0
  sqflite: ^2.3.3+1
  sqflite_common: ^2.5.4+3
  timeago: ^3.7.1
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/videos/
    - assets/audios/
    - assets/rive_animations/
    - assets/pdfs/
    - assets/jsons/
  